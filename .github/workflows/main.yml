name: Build Orbit Windows EXE

on:
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install dependencies and build
        shell: pwsh
        run: |
          $buildScript = Get-ChildItem -Path . -Recurse -File -Filter build_windows.py |
            Select-Object -First 1

          if (-not $buildScript) {
            throw "build_windows.py not found"
          }

          $projectRoot = $buildScript.Directory.FullName

          python -m pip install -r (Join-Path $projectRoot "requirements.txt") pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -X utf8 $buildScript.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-Windows
          path: '**/dist/*.exe'
          if-no-files-found: error
